  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 600\">Поток с&nbsp;9&nbsp;по&nbsp;22&nbsp;ноября<\u002Fp>\n<h1 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: clamp(38px, 5.6vw, 76px); line-height: 1.05; letter-spacing: -0.02em\">$1000 за&nbsp;14&nbsp;дней<br><span style=\"color: {{accent}}\">с&nbsp;HASH&nbsp;AI<\u002Fspan><\u002Fh1>\n<p style=\"margin: 28px 0 0; font-size: 21px; color: #B6BFD3; max-width: 590px\">Готовая проверенная система: тексты, <span style=\"white-space: nowrap\">видео-интервью<\u002Fspan> и&nbsp;<span style=\"white-space: nowrap\">ИИ-агент<\u002Fspan>, который сам&nbsp;начинает переписки. Ничего не&nbsp;нужно придумывать&nbsp;— план на&nbsp;каждый день и&nbsp;наставник рядом.<\u002Fp>\n<div style=\"margin-top: 36px; display: flex; flex-wrap: wrap; gap: 16px\">\n<a href=\"#join\" style=\"background: #5B4BEB; color: #FFFFFF; text-decoration: none; border-radius: 14px; padding: 18px 32px; font-weight: 700; font-size: 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Хочу в&nbsp;поток<\u002Fa>\n<a href=\"#how\" style=\"color: #E8ECF5; text-decoration: none; border: 1px solid #34405C; border-radius: 14px; padding: 18px 32px; font-weight: 600; font-size: 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center\">Как&nbsp;это&nbsp;работает<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; min-width: 0; max-width: 440px; background: #131B30; border: 1px solid #222C47; border-radius: 28px; padding: 24px; box-shadow: 0 30px 80px rgba(91, 75, 235, 0.25)\">\n<div style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #222C47\">\n<div style=\"width: 40px; height: 40px; border-radius: 50%; background: #2A2370; display: flex; align-items: center; justify-content: center; color: #C9C3FF; font-weight: 700\">И<\u002Fdiv>\n<div><p style=\"margin: 0; font-weight: 700; font-size: 16px\">Ирина<\u002Fp><p style=\"margin: 0; font-size: 13px;  20px; padding: 32px\">\n<div style=\"width: 52px; height: 52px; border-radius: 50%; background: #2A2370; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C9C3FF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 24px\">01 · Знакомство<\u002Fh3>\n<p style=\"margin: 0; color: #B6BFD3\"><span style=\"white-space: nowrap\">10–20<\u002Fspan>&nbsp;касаний в&nbsp;день вручную по&nbsp;готовым текстам и&nbsp;через Ледоруб. Первое сообщение&nbsp;— знакомство, а&nbsp;не&nbsp;продажа. Когда человек ответил, предлагаем <span style=\"white-space: nowrap\">видео-интервью<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 32px\">\n<div style=\"width: 52px; height: 52px; border-radius: 50%; background: #2A2370; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C9C3FF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M16 10l6-3v10l-6-3z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 20px 0 8px; font-size: 24px\">02 · <span style=\"white-space: nowrap\">Видео-интервью<\u002Fspan><\u002Fh3>\n<p style=\"margin: 0; color: #B6BFD3\">Человек смотрит интервью с&nbsp;разработчиками HASH&nbsp;AI&nbsp;и&nbsp;сам&nbsp;решает, интересно&nbsp;ли&nbsp;ему. Без&nbsp;давления.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 32px\">\n<div style=\"width: 52px; height: 52px; border-radius: 50%; background: #2A2370; display: flex; align-items: center; лка в&nbsp;первом сообщении<\u002Fli>\n<li>Не&nbsp;реагирует на&nbsp;ответ человека<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"background: #1E1A52; border: 1px solid #3A3390; border-radius: 24px; padding: 32px\">\n<h3 style=\"margin: 0 0 20px; font-size: 22px; color: #C9C3FF\"><span style=\"white-space: nowrap\">ИИ-диалог<\u002Fspan> Ледоруба<\u002Fh3>\n<div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n<p style=\"margin: 0; align-self: flex-start; max-width: 88%; background: #5B4BEB; color: #FFFFFF; padding: 10px 14px; border-radius: 16px 16px 16px 4px\">Привет! Мы&nbsp;в&nbsp;одном чате, решила познакомиться&nbsp;— не&nbsp;против?<\u002Fp>\n<p style=\"margin: 0; align-self: flex-end; max-width: 88%; background: #2A2F4A; padding: 10px 14px; border-radius: 16px 16px 4px 16px\">Привет! Давай<\u002Fp>\n<\u002Fdiv>\n<ul style=\"margin: 20px 0 0; padding-left: 20px; color: #E8ECF5; display: flex; flex-direction: column; gap: 6px\">\n<li>Знакомство и&nbsp;вопрос по&nbsp;интересам<\u002Fli>\n<li>Выясняет интерес, отвечает на&nbsp;типовые вопросы<\u002Fli>\n<li>Видео только после интереса, тёплых передаёт тебе<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; background: #131B30; border: 1px solid #2E5B45; border-radius: 24px; padding: clamp(28px, 4vw, 40px); display: flex; flex-wrap: wrap; gap: 28px; align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<p style=\"margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7EE2A8\">Уже&nbsp;есть свой бизнес?<\u002Fp>\n<h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2\">Ледоруб работает и&nbsp;на&nbsp;твой основной проект<\u002Fh3>\n<p style=\"margin: 14px 0 0; color: #B6BFD3\">Его&nbsp;можно настроить на&nbsp;свой продукт: приводить людей в&nbsp;клиентский чат, на&nbsp;консультацию, марафон или&nbsp;презентацию. HASH не&nbsp;конкурирует с&nbsp;твоей компанией, а&nbsp;даёт ей&nbsp;поток новых людей.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; background: #0F1629; border-radius: 14px; padding: 14px 18px\"><span style=\"font-weight: 700\">Годовой:<\u002Fspan> 1&nbsp;свой проект + 1&nbsp;проект HASH<\u002Fp>\n<p style=\"margin: 0; background: #0F1629; border-radius: 14px; padding: 14px 18px\"><span style=\"font-weight: 700\">«Безлимит»:<\u002Fspan> без&nbsp;ограничений по&nbsp;проектам<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Три&nbsp;уровня результата<\u002Fp>\n<h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Что&nbsp;ты&nbsp;получишь за&nbsp;14&nbsp;дней<\u002Fh2>\n<p style=\"margin: 16px 0 40px; color: #B6BFD3; max-width: 680px\">Мы&nbsp;гарантируем свою часть: план, систему, эфиры и&nbsp;поддержку. Касания и&nbsp;встречи&nbsp;— твои.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; align-items: end\">\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 32px; min-height: 200px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; color: #9AA4BC; letter-spacing: 0.08em; text-transform: uppercase\">Минимальный<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 20px\">Запущенный Ледоруб и&nbsp;касания с&nbsp;новыми людьми каждый день<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #2A2370; border-radius: 20px; padding: 32px; min-height: 260px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; color: #C9C3FF; letter-spacing: 0.08em; text-transform: uppercase\">Основной<\u002Fp>\n<p style=\"margin: 12px 0 0; font-size: 20px\">Первые заинтересованные, созвоны и&nbsp;продажи<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #5B4BEB; border-radius: 20px; padding: 32px; min-height: 320px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; color: #FFFFFF\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; color: #EEEBFF; letter-spacing: 0.08em; text-transform: uppercase\">Со&nbsp;звёздочкой<\u002Fp>\n<p style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: 36px; font-weight: 700; line-height: 1.1\">$1000+<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 18px; color: #EEEBFF\">уже&nbsp;в&nbsp;процессе запуска<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Арифметика цели<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Откуда $1000<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<div style=\"flex: 1 1 340px; min-width: 0; background: #1E1A52; border: 1px solid #3A3390; border-radius: 24px; padding: 36px\">\n<p style=\"margin: 0; color: #C9C3FF\">Твоя комиссия с&nbsp;одной продажи «Безлимита»<\u002Fp>\n<p style=\"margin: 8px 0 0; font-family: Unbounded, sans-serif; font-size: clamp(44px, 5vw, 64px); font-weight: 700; line-height: 1; color: #7EE2A8; white-space: nowrap\">$250<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #D4DAE8\">«Безлимит» стоит $1&nbsp;250 (полная цена, без&nbsp;промокодов). На&nbsp;старте, на&nbsp;ранге H1, тебе начисляется 20% от&nbsp;цены&nbsp;— $250. После двух продаж разным людям ранг H2&nbsp;и&nbsp;25%&nbsp;— $312.<\u002Fp>\n<p style=\"margin: 12px 0 0; color: #D4DAE8\">Годовой стоит $470: $94&nbsp;на&nbsp;H1&nbsp;и&nbsp;$117&nbsp;на&nbsp;H2.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 2 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px\">\n<div style=\"background: #131B30; border: 2px solid #5B4BEB; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #C9C3FF; text-transform: uppercase; letter-spacing: 0.08em\">Основной путь<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">4 «Безлимита»<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #7EE2A8; white-space: nowrap\">$1&nbsp;124<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">250 + 250 + 312 + 312<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #9AA4BC; text-transform: uppercase; letter-spacing: 0.08em\">Микс<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">3 «Безлимита» + 2&nbsp;годовых<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #E8ECF5; white-space: nowrap\">$1&nbsp;046<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">250 + 250 + 312 + 117 + 117<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #9AA4BC; text-transform: uppercase; letter-spacing: 0.08em\">Только годовые<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">9&nbsp;годовых<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #E8ECF5; white-space: nowrap\">$1&nbsp;007<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">94 + 94 + 7&nbsp;× 117<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #131B30; border-radius: 20px; padding: 24px 28px\">\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">140–280<\u002Fspan> касаний<\u002Fp><p style=\"margin: 0; color: {{accent}}\">→<\u002Fp>\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">7–14<\u002Fspan> заинтересованных<\u002Fp><p style=\"margin: 0; color: {{accent}}\">→<\u002Fp>\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">4–9<\u002Fspan> продаж<\u002Fp>\n<p style=\"margin: 0; flex-basis: 100%; font-size: 15px; color: #8E98B0\">При&nbsp;отклике около&nbsp;5% и&nbsp;<span style=\"white-space: nowrap\">10–20<\u002Fspan>&nbsp;касаниях в&nbsp;день. Первые две&nbsp;продажи считаются по&nbsp;20%, вторая открывает H2, дальше 25%. Ставки по&nbsp;маркетингу HASH&nbsp;AI.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Программа · <span style=\"white-space: nowrap\">9–22<\u002Fspan> ноября<\u002Fp>\n<h2 style=\"margin: 0 0 16px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">14&nbsp;дней по&nbsp;шагам<\u002Fh2>\n<p style=\"margin: 0 0 48px; color: #B6BFD3; max-width: 680px\">Три&nbsp;эфира с&nbsp;Максимом и&nbsp;Анной: старт, разбор и&nbsp;итоги. Каждый вечер&nbsp;— короткий отчёт в&nbsp;общем <span style=\"white-space: nowrap\">Telegram-чате<\u002Fspan>.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); row-gap: 32px\">\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{accent}}\">9.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Старт<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир, выбор связки, первые 10&nbsp;касаний<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{accent}}\"><span style=\"white-space: nowrap\">10–11<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">72&nbsp;часа<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Ледоруб запущен, касания каждый день<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{accent}}\"><span style=\"white-space: nowrap\">12–15<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Встречи<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\"><span style=\"white-space: nowrap\">Видео-интервью<\u002Fspan>, созвоны, первые продажи<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{accent}}\">16.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Разбор<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир: что&nbsp;работает, возражения<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: {{accent}}\"><span style=\"white-space: nowrap\">17–21<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Дозакрытие<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Созвоны и&nbsp;встречи втроём<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #7EE2A8; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #7EE2A8\">22.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Итоги<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир, твой результат и&nbsp;кейс<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 0\">\n<div style=\"background: #1E1A52; border: 1px solid #3A3390; border-radius: 28px; padding: clamp(28px, 5vw, 56px)\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC; color: #C9C3FF\">Для&nbsp;лидеров<\u002Fp>\n<h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15; max-width: 820px\">$1000&nbsp;— первая ступень. Дальше ты&nbsp;запускаешь по&nbsp;системе всю&nbsp;команду<\u002Fh2>\n<p style=\"margin: 16px 0 40px; color: #D4DAE8; max-width: 720px\">Система одна и&nbsp;та&nbsp;же&nbsp;для&nbsp;тебя и&nbsp;для&nbsp;твоих людей. Поэтому она&nbsp;дублируется: активные приводят активных.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #C9C3FF\">Ступень 1<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Ты&nbsp;проходишь поток и&nbsp;выходишь на&nbsp;первые $1000.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #C9C3FF\">Ступень 2<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Твои люди идут в&nbsp;следующий поток, а&nbsp;ты&nbsp;ведёшь их&nbsp;по&nbsp;той&nbsp;же&nbsp;схеме вместе с&nbsp;наставниками.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #7EE2A8\">Повтор<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Каждый поток добавляет новый уровень в&nbsp;структуру.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 32px; background: #0F1629; border-radius: 20px; padding: 28px\">\n<p style=\"margin: 0 0 18px; font-weight: 700\">Как&nbsp;это&nbsp;уже&nbsp;работает в&nbsp;команде Максима<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\">Максим<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">1-й<\u002Fspan> уровень<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">2-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">3-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">4-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #1A3A2E; color: #A9F0C8; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">5-й<\u002Fspan> уровень<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 18px 0 0; color: #B6BFD3\">Одна из&nbsp;веток в&nbsp;команде Максима за&nbsp;полтора месяца ушла на&nbsp;5&nbsp;уровней вглубь: 5&nbsp;«Безлимитов» и&nbsp;$4&nbsp;547&nbsp;оборота. Активные приводят активных. А&nbsp;у&nbsp;Анны за&nbsp;10&nbsp;дней&nbsp;— $12&nbsp;585&nbsp;оборота команды.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Форматы участия<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Выбери свою точку старта<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 24px; padding: 36px\">\n<h3 style=\"margin: 0; font-size: 22px\">Годовой + запуск<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: 36px; font-weight: 700; color: {{accent}}; white-space: nowrap\">$470<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #B6BFD3\">Год&nbsp;доступа к&nbsp;платформе, Ледоруб на&nbsp;1&nbsp;свой проект + 1&nbsp;проект HASH (до&nbsp;50&nbsp;аккаунтов) и&nbsp;участие в&nbsp;потоке.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #1E1A52; border: 2px solid #5B4BEB; border-radius: 24px; padding: 36px; position: relative\">\n<p style=\"margin: 0 0 12px; display: inline-block; background: #5B4BEB; color: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700\">Рекомендуем<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">«Безлимит» + запуск<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: 36px; font-weight: 700; color: {{accent}}; white-space: nowrap\">$1&nbsp;250<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #D4DAE8\">Бессрочный доступ, Ледоруб без&nbsp;ограничений по&nbsp;проектам и&nbsp;аккаунтам и&nbsp;участие в&nbsp;потоке. Для&nbsp;тех, кто&nbsp;планирует несколько циклов.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 15px; color: #8E98B0\">Участвовать можно и&nbsp;с&nbsp;месячным тарифом, но&nbsp;без&nbsp;Ледоруба всё&nbsp;придётся делать вручную.<\u002Fp>\n<p style=\"margin: 24px 0 0; background: #131B30; border-radius: 16px; padding: 18px 22px; color: #D4DAE8\"><span style=\"font-weight: 700\">Ледоруб «под&nbsp;ключ»:<\u002Fspan> готовые <span style=\"white-space: nowrap\">премиум-аккаунты<\u002Fspan>, всё&nbsp;настроено и&nbsp;запущено, сообщения и&nbsp;промпты внутри. 10&nbsp;аккаунтов&nbsp;— 18&nbsp;500&nbsp;₽, 20&nbsp;аккаунтов&nbsp;— 25&nbsp;000&nbsp;₽.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Без&nbsp;завышенных ожиданий<\u002Fp>\n<h2 style=\"margin: 0 0 32px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Частые вопросы<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">ИИ&nbsp;продаёт вместо меня?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Нет. Ледоруб находит людей, начинает диалог и&nbsp;выявляет интерес. Созвоны и&nbsp;продажи&nbsp;— на&nbsp;тебе, с&nbsp;поддержкой наставника.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Нужно разбираться в&nbsp;технической настройке?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Нет. Можно настроить по&nbsp;инструкции или&nbsp;заказать Ледоруб «под&nbsp;ключ».<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Сколько я&nbsp;заработаю?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Гарантировать сумму нельзя: результат зависит от&nbsp;количества касаний и&nbsp;скорости ответа. Мы&nbsp;гарантируем свою часть&nbsp;— план, систему, эфиры и&nbsp;поддержку.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Боюсь звонить&nbsp;— это&nbsp;обязательно?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Созвон нужен только на&nbsp;последнем шаге, чтобы помочь с&nbsp;выбором тарифа. Если страшно, его&nbsp;можно провести втроём с&nbsp;наставником.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Кому подходит поток?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Сетевым партнёрам и&nbsp;лидерам, которым нужны новые люди и&nbsp;которые готовы 2&nbsp;недели делать <span style=\"white-space: nowrap\">10–20<\u002Fspan>&nbsp;касаний в&nbsp;день и&nbsp;быстро отвечать заинтересованным. Не&nbsp;подойдёт тем, кто&nbsp;ждёт, что&nbsp;ИИ&nbsp;всё&nbsp;сделает сам, или&nbsp;хочет продаж без&nbsp;своих действий.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Ведущие потока<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Кто&nbsp;ведёт<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 24px; padding: 36px\">\n<img src=\"133ea5f1-f28b-420e-bde3-647d7359ce98\" alt=\"Максим Никитин\" style=\"width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 18px; display: block; margin-bottom: 24px\">\n<h3 style=\"margin: 0; font-size: 26px\">Максим Никитин<\u002Fh3>\n<p style=\"margin: 6px 0 0; color: {{accent}}; font-weight: 600\">Эксперт по&nbsp;автоворонкам и&nbsp;<span style=\"white-space: nowrap\">ИИ-агентам<\u002Fspan><\u002Fp>\n<p style=\"margin: 16px 0 0; color: #B6BFD3\"><span style=\"white-space: nowrap\">Интернет-предприниматель<\u002Fspan>, автор челленджа «Попробуй и&nbsp;продай». Даёт только инструменты, которые пр yle=\"margin: 8px 0 0; font-size: 18px; color: #EEEBFF\">уже&nbsp;в&nbsp;процессе запуска<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Арифметика цели<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Откуда $1000<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<div style=\"flex: 1 1 340px; min-width: 0; background: #1E1A52; border: 1px solid #3A3390; border-radius: 24px; padding: 36px\">\n<p style=\"margin: 0; color: #C9C3FF\">Твоя комиссия с&nbsp;одной продажи «Безлимита»<\u002Fp>\n<p style=\"margin: 8px 0 0; font-family: Unbounded, sans-serif; font-size: clamp(44px, 5vw, 64px); font-weight: 700; line-height: 1; color: #7EE2A8; white-space: nowrap\">$250<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #D4DAE8\">«Безлимит» стоит $1&nbsp;250 (полная цена, без&nbsp;промокодов). На&nbsp;старте, на&nbsp;ранге H1, тебе начисляется 20% от&nbsp;цены&nbsp;— $250. После двух продаж разным людям ранг H2&nbsp;и&nbsp;25%&nbsp;— $312.<\u002Fp>\n<p style=\"margin: 12px 0 0; color: #D4DAE8\">Годовой стоит $470: $94&nbsp;на&nbsp;H1&nbsp;и&nbsp;$117&nbsp;на&nbsp;H2.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 2 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px\">\n<div style=\"background: #131B30; border: 2px solid #5B4BEB; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #C9C3FF; text-transform: uppercase; letter-spacing: 0.08em\">Основной путь<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">4 «Безлимита»<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #7EE2A8; white-space: nowrap\">$1&nbsp;124<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">250 + 250 + 312 + 312<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #9AA4BC; text-transform: uppercase; letter-spacing: 0.08em\">Микс<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">3 «Безлимита» + 2&nbsp;годовых<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #E8ECF5; white-space: nowrap\">$1&nbsp;046<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">250 + 250 + 312 + 117 + 117<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 20px; padding: 24px\"><p style=\"margin: 0; font-size: 13px; font-weight: 700; color: #9AA4BC; text-transform: uppercase; letter-spacing: 0.08em\">Только годовые<\u002Fp><p style=\"margin: 10px 0 0; font-size: 19px; font-weight: 700\">9&nbsp;годовых<\u002Fp><p style=\"margin: 6px 0 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #E8ECF5; white-space: nowrap\">$1&nbsp;007<\u002Fp><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #8E98B0\">94 + 94 + 7&nbsp;× 117<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #131B30; border-radius: 20px; padding: 24px 28px\">\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">140–280<\u002Fspan> касаний<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">7–14<\u002Fspan> заинтересованных<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; font-weight: 700; white-space: nowrap\"><span style=\"white-space: nowrap\">4–9<\u002Fspan> продаж<\u002Fp>\n<p style=\"margin: 0; flex-basis: 100%; font-size: 15px; color: #8E98B0\">При&nbsp;отклике около&nbsp;5% и&nbsp;<span style=\"white-space: nowrap\">10–20<\u002Fspan>&nbsp;касаниях в&nbsp;день. Первые две&nbsp;продажи считаются по&nbsp;20%, вторая открывает H2, дальше 25%. Ставки по&nbsp;маркетингу HASH&nbsp;AI.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Программа · <span style=\"white-space: nowrap\">9–22<\u002Fspan> ноября<\u002Fp>\n<h2 style=\"margin: 0 0 16px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">14&nbsp;дней по&nbsp;шагам<\u002Fh2>\n<p style=\"margin: 0 0 48px; color: #B6BFD3; max-width: 680px\">Три&nbsp;эфира с&nbsp;Максимом и&nbsp;Анной: старт, разбор и&nbsp;итоги. Каждый вечер&nbsp;— короткий отчёт в&nbsp;общем <span style=\"white-space: nowrap\">Telegram-чате<\u002Fspan>.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); row-gap: 32px\">\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #9D92FF\">9.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Старт<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир, выбор связки, первые 10&nbsp;касаний<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #9D92FF\"><span style=\"white-space: nowrap\">10–11<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">72&nbsp;часа<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Ледоруб запущен, касания каждый день<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #9D92FF\"><span style=\"white-space: nowrap\">12–15<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Встречи<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\"><span style=\"white-space: nowrap\">Видео-интервью<\u002Fspan>, созвоны, первые продажи<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #9D92FF\">16.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Разбор<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир: что&nbsp;работает, возражения<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #5B4BEB; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #9D92FF\"><span style=\"white-space: nowrap\">17–21<\u002Fspan>.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Дозакрытие<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Созвоны и&nbsp;встречи втроём<\u002Fp><\u002Fdiv>\n<div style=\"padding: 0 16px 0 0; border-top: 2px solid #2A2370\"><div style=\"width: 16px; height: 16px; border-radius: 50%; background: #7EE2A8; margin-top: -9px\"><\u002Fdiv><p style=\"margin: 16px 0 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; color: #7EE2A8\">22.11<\u002Fp><p style=\"margin: 6px 0 0; font-weight: 700\">Итоги<\u002Fp><p style=\"margin: 4px 0 0; font-size: 15px; color: #B6BFD3\">Эфир, твой результат и&nbsp;кейс<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 0\">\n<div style=\"background: #1E1A52; border: 1px solid #3A3390; border-radius: 28px; padding: clamp(28px, 5vw, 56px)\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC; color: #C9C3FF\">Для&nbsp;лидеров<\u002Fp>\n<h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15; max-width: 820px\">$1000&nbsp;— первая ступень. Дальше ты&nbsp;запускаешь по&nbsp;системе всю&nbsp;команду<\u002Fh2>\n<p style=\"margin: 16px 0 40px; color: #D4DAE8; max-width: 720px\">Система одна и&nbsp;та&nbsp;же&nbsp;для&nbsp;тебя и&nbsp;для&nbsp;твоих людей. Поэтому она&nbsp;дублируется: активные приводят активных.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #C9C3FF\">Ступень 1<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Ты&nbsp;проходишь поток и&nbsp;выходишь на&nbsp;первые $1000.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #C9C3FF\">Ступень 2<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Твои люди идут в&nbsp;следующий поток, а&nbsp;ты&nbsp;ведёшь их&nbsp;по&nbsp;той&nbsp;же&nbsp;схеме вместе с&nbsp;наставниками.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 20px; padding: 28px\"><p style=\"margin: 0; font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 700; color: #7EE2A8\">Повтор<\u002Fp><p style=\"margin: 10px 0 0; color: #D4DAE8\">Каждый поток добавляет новый уровень в&nbsp;структуру.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 32px; background: #0F1629; border-radius: 20px; padding: 28px\">\n<p style=\"margin: 0 0 18px; font-weight: 700\">Как&nbsp;это&nbsp;уже&nbsp;работает в&nbsp;команде Максима<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\">Максим<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">1-й<\u002Fspan> уровень<\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">2-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">3-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #2A2370; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">4-й<\u002Fspan><\u002Fp><p style=\"margin: 0; color: #9D92FF\">→<\u002Fp>\n<p style=\"margin: 0; background: #1A3A2E; color: #A9F0C8; border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap\"><span style=\"white-space: nowrap\">5-й<\u002Fspan> уровень<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 18px 0 0; color: #B6BFD3\">Одна из&nbsp;веток в&nbsp;команде Максима за&nbsp;полтора месяца ушла на&nbsp;5&nbsp;уровней вглубь: 5&nbsp;«Безлимитов» и&nbsp;$4&nbsp;547&nbsp;оборота. Активные приводят активных. А&nbsp;у&nbsp;Анны за&nbsp;10&nbsp;дней&nbsp;— $12&nbsp;585&nbsp;оборота команды.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Форматы участия<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Выбери свою точку старта<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 24px; padding: 36px\">\n<h3 style=\"margin: 0; font-size: 22px\">Годовой + запуск<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: 36px; font-weight: 700; color: #9D92FF; white-space: nowrap\">$470<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #B6BFD3\">Год&nbsp;доступа к&nbsp;платформе, Ледоруб на&nbsp;1&nbsp;свой проект + 1&nbsp;проект HASH (до&nbsp;50&nbsp;аккаунтов) и&nbsp;участие в&nbsp;потоке.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #1E1A52; border: 2px solid #5B4BEB; border-radius: 24px; padding: 36px; position: relative\">\n<p style=\"margin: 0 0 12px; display: inline-block; background: #5B4BEB; color: #FFFFFF; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700\">Рекомендуем<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px\">«Безлимит» + запуск<\u002Fh3>\n<p style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: 36px; font-weight: 700; color: #9D92FF; white-space: nowrap\">$1&nbsp;250<\u002Fp>\n<p style=\"margin: 16px 0 0; color: #D4DAE8\">Бессрочный доступ, Ледоруб без&nbsp;ограничений по&nbsp;проектам и&nbsp;аккаунтам и&nbsp;участие в&nbsp;потоке. Для&nbsp;тех, кто&nbsp;планирует несколько циклов.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 15px; color: #8E98B0\">Участвовать можно и&nbsp;с&nbsp;месячным тарифом, но&nbsp;без&nbsp;Ледоруба всё&nbsp;придётся делать вручную.<\u002Fp>\n<p style=\"margin: 24px 0 0; background: #131B30; border-radius: 16px; padding: 18px 22px; color: #D4DAE8\"><span style=\"font-weight: 700\">Ледоруб «под&nbsp;ключ»:<\u002Fspan> готовые <span style=\"white-space: nowrap\">премиум-аккаунты<\u002Fspan>, всё&nbsp;настроено и&nbsp;запущено, сообщения и&nbsp;промпты внутри. 10&nbsp;аккаунтов&nbsp;— 18&nbsp;500&nbsp;₽, 20&nbsp;аккаунтов&nbsp;— 25&nbsp;000&nbsp;₽.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Без&nbsp;завышенных ожиданий<\u002Fp>\n<h2 style=\"margin: 0 0 32px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Частые вопросы<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">ИИ&nbsp;продаёт вместо меня?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Нет. Ледоруб находит людей, начинает диалог и&nbsp;выявляет интерес. Созвоны и&nbsp;продажи&nbsp;— на&nbsp;тебе, с&nbsp;поддержкой наставника.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Нужно разбираться в&nbsp;технической настройке?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Нет. Можно настроить по&nbsp;инструкции или&nbsp;заказать Ледоруб «под&nbsp;ключ».<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Сколько я&nbsp;заработаю?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Гарантировать сумму нельзя: результат зависит от&nbsp;количества касаний и&nbsp;скорости ответа. Мы&nbsp;гарантируем свою часть&nbsp;— план, систему, эфиры и&nbsp;поддержку.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Боюсь звонить&nbsp;— это&nbsp;обязательно?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Созвон нужен только на&nbsp;последнем шаге, чтобы помочь с&nbsp;выбором тарифа. Если страшно, его&nbsp;можно провести втроём с&nbsp;наставником.<\u002Fp><\u002Fdiv>\n<div style=\"background: #131B30; border-radius: 18px; padding: 22px 26px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Кому подходит поток?<\u002Fh3><p style=\"margin: 12px 0 0; color: #B6BFD3\">Сетевым партнёрам и&nbsp;лидерам, которым нужны новые люди и&nbsp;которые готовы 2&nbsp;недели делать <span style=\"white-space: nowrap\">10–20<\u002Fspan>&nbsp;касаний в&nbsp;день и&nbsp;быстро отвечать заинтересованным. Не&nbsp;подойдёт тем, кто&nbsp;ждёт, что&nbsp;ИИ&nbsp;всё&nbsp;сделает сам, или&nbsp;хочет продаж без&nbsp;своих действий.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #0F1629; border-top: 1px solid #1A2340; border-bottom: 1px solid #1A2340\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px\">\n<p style=\"margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9AA4BC\">Ведущие потока<\u002Fp>\n<h2 style=\"margin: 0 0 40px; font-family: Unbounded, sans-serif; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.15\">Кто&nbsp;ведёт<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px\">\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 24px; padding: 36px\">\n<img src=\"133ea5f1-f28b-420e-bde3-647d7359ce98\" alt=\"Максим Никитин\" style=\"width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 18px; display: block; margin-bottom: 24px\">\n<h3 style=\"margin: 0; font-size: 26px\">Максим Никитин<\u002Fh3>\n<p style=\"margin: 6px 0 0; color: #9D92FF; font-weight: 600\">Эксперт по&nbsp;автоворонкам и&nbsp;<span style=\"white-space: nowrap\">ИИ-агентам<\u002Fspan><\u002Fp>\n<p style=\"margin: 16px 0 0; color: #B6BFD3\"><span style=\"white-space: nowrap\">Интернет-предприниматель<\u002Fspan>, автор челленджа «Попробуй и&nbsp;продай». Даёт только инструменты, которые проверил сам. Более 15&nbsp;лет&nbsp;руководил сетью филиалов от&nbsp;Новосибирска до&nbsp;Якутии.<\u002Fp>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px\">\n<p style=\"margin: 0; background: #1E1A52; color: #D6D1FF; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">20&nbsp;лет&nbsp;в&nbsp;сетевом бизнесе<\u002Fp>\n<p style=\"margin: 0; background: #1E1A52; color: #D6D1FF; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">Ледоруб для&nbsp;5&nbsp;проектов<\u002Fp>\n<p style=\"margin: 0; background: #1A3A2E; color: #A9F0C8; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">$1&nbsp;400&nbsp;вручную за&nbsp;45&nbsp;дней<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #131B30; border: 1px solid #222C47; border-radius: 24px; padding: 36px\">\n<img src=\"77196453-2fb6-4fb1-ab9b-559a155e8ab1\" alt=\"Анна Христюк\" style=\"width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 18px; display: block; margin-bottom: 24px\">\n<h3 style=\"margin: 0; font-size: 26px\">Анна Христюк<\u002Fh3>\n<p style=\"margin: 6px 0 0; color: #9D92FF; font-weight: 600\"><span style=\"white-space: nowrap\">Продюсер-стратег<\u002Fspan><\u002Fp>\n<p style=\"margin: 16px 0 0; color: #B6BFD3\">Основатель продюсерского центра «Компас» и&nbsp;автор чата «Большая игра лидеров». 8&nbsp;лет&nbsp;в&nbsp;маркетинге. Цель на&nbsp;3&nbsp;года&nbsp;— 1000&nbsp;успешных кейсов среди учеников.<\u002Fp>\n<div style=\"margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px\">\n<p style=\"margin: 0; background: #1E1A52; color: #D6D1FF; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">1,8&nbsp;млн&nbsp;₽ за&nbsp;запуск с&nbsp;339&nbsp;подписчиков<\u002Fp>\n<p style=\"margin: 0; background: #1E1A52; color: #D6D1FF; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">23&nbsp;млн&nbsp;₽ на&nbsp;блоге за&nbsp;год<\u002Fp>\n<p style=\"margin: 0; background: #1A3A2E; color: #A9F0C8; border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600\">$1&nbsp;643&nbsp;в&nbsp;HASH за&nbsp;10&nbsp;дней<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"join\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 120px\">\n<div style=\"background: #5B4BEB; border-radius: 28px; padding: clamp(32px, 6vw, 72px); color: #FFFFFF; display: flex; flex-wrap: wrap; gap: 40px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #E4E0FF\">Старт 9&nbsp;ноября<\u002Fp>\n<h2 style=\"margin: 12px 0 0; font-family: Unbounded, sans-serif; font-size: clamp(28px, 4vw, 44px); line-height: 1.15\">Хочешь в&nbsp;поток? Напиши слово<\u002Fh2>\n<p style=\"margin: 20px 0 0; font-size: 20px; color: #EEEBFF; max-width: 520px\">тому, кто&nbsp;прислал тебе эту&nbsp;страницу. Он&nbsp;задаст пару вопросов, расскажет о&nbsp;форматах и&nbsp;поможет подключиться.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 0; background: #FFFFFF; color: #2A1F9E; border-radius: 24px; padding: 20px 48px; font-family: Unbounded, sans-serif; font-size: clamp(56px, 8vw, 96px); font-weight: 700; line-height: 1\">1000<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 32px 0 0; font-size: 15px; color: #8E98B0; max-width: 820px\">$1000&nbsp;— это&nbsp;цель с&nbsp;понятной арифметикой, а&nbsp;не&nbsp;обещанный доход. Результат зависит от&nbsp;твоих действий, аудитории и&nbsp;условий партнёрской программы HASH&nbsp;AI. Кейсы показывают результаты конкретных людей.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9D92FF&quot;,&quot;options&quot;:[&quot;#9D92FF&quot;,&quot;#7EE2A8&quot;,&quot;#F5B65A&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8000}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#9D92FF' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
